---
# Example: artifact-driven conditional routing
#
# This is a schema-valid illustration of conditions over artifacts. The shell
# steps deliberately stand in for external agents; provide real producers and
# artifact mounts before attempting to run it end-to-end.

entrypoint: artifact-driven-pipeline

vars:
  issue: RHAISTRAT-42
  model: opus

workflows:
  - name: artifact-driven-pipeline
    description: Route an RFE through placeholder analysis and strategy stages.
    steps:
      - name: rfe-analysis
        type: shell_exec
        params:
          command: >-
            echo "calling rfe-creator for {{ issue }} (would write analysis artifacts)"
        artifacts:
          result:
            path: "/app/artifacts/{{ issue }}/rfe-analysis/result.yaml"
            format: yaml

      - name: confidence-check
        type: shell_exec
        when: "rfe-analysis.artifacts.result.confidence >= 0.7"
        params:
          command: "echo 'analysis confidence is high enough to continue'"

      - name: create-strategy
        type: shell_exec
        when: "rfe-analysis.artifacts.result.recommendation != 'reject'"
        params:
          command: >-
            echo "calling strategy-create for {{ issue }} with model {{ model }}"
        artifacts:
          strategy:
            path: "/app/artifacts/{{ issue }}/strategy/strategy.yaml"
            format: yaml
          document:
            path: "/app/artifacts/{{ issue }}/strategy/strategy.md"
            format: markdown

      - name: needs-review
        type: shell_exec
        when: "create-strategy.artifacts.document.frontmatter.approval == 'pending'"
        params:
          command: "echo 'strategy requires human review'"

      - name: deep-refinement
        type: shell_exec
        when: "create-strategy.artifacts.strategy.complexity == 'high'"
        params:
          command: "echo 'calling deep strategy refinement'"

      - name: light-refinement
        type: shell_exec
        when: "create-strategy.artifacts.strategy.complexity == 'medium'"
        params:
          command: "echo 'calling light strategy refinement'"

      - name: auto-approve
        type: shell_exec
        when: "create-strategy.artifacts.strategy.complexity == 'low'"
        params:
          command: "echo 'auto-approving low-complexity strategy'"

      - name: load-blockers
        type: load_artifact
        artifacts:
          blockers:
            path: "/app/artifacts/{{ issue }}/blockers.yaml"
            format: yaml
            optional: true

      - name: report-blockers
        type: shell_exec
        when: "load-blockers.artifacts.blockers != None"
        params:
          command: "echo 'blockers found; request remediation'"

      - name: risk-escalation
        type: shell_exec
        when: "create-strategy.artifacts.strategy.risks | length > 2"
        params:
          command: "echo 'escalating strategy with multiple risks'"
